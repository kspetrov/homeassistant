# coridor
corridor_toggle:
  alias: Corridor TOGGLE
  sequence:
    - service: remote.send_command

      target:
        entity_id: remote.broadlink_rm4_pro_remote
      data:
        command: b64:
    - service: input_boolean.toggle
      data:
        entity_id: input_boolean.corridor
corridor_on:
  alias: Corridor ON
  sequence:
    - service: remote.send_command
      target:
        entity_id: remote.broadlink_rm4_pro_remote
      data:
        command: b64:
        num_repeats: 2
        delay_secs: 1
    - service: input_boolean.turn_on
      data:
        entity_id: input_boolean.corridor
corridor_off:
  alias: Corridor OFF
  sequence:
    - service: remote.send_command
      target:
        entity_id: remote.broadlink_rm4_pro_remote
