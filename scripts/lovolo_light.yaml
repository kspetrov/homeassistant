# All light - just teach all switches to this code
all_lights_off:
  alias: All lights OFF
  sequence:
    - service: remote.send_command
      target:
        entity_id: remote.broadlink_rm4_pro_remote
      data:
        command: b64:
        num_repeats: 3
        delay_secs: 1
    - service: input_boolean.turn_off
      data:
        entity_id:
          - input_boolean.corridor
          - input_boolean.small_corridor
          - input_boolean.bathroom
          - input_boolean.toilet
          - input_boolean.hall_gang_1
          - input_boolean.hall_gang_2
          - input_boolean.hall_power_socket
          - input_boolean.kitchen
          - input_boolean.kitchen_backlight
          - input_boolean.kitchen_power_socket
          - input_boolean.cabinet
          - input_boolean.bedroom
          - input_boolean.children_room