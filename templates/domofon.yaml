- binary_sensor:
  - name: "smartintercom state"
    device_class: "door"
    state: >
      {% if is_state("switch.smartintercom_accept_call", "on") or is_state("select.smartintercom_modes", "Открывать всегда") %}
        on
      {% else %}
        off
      {% endif %}

  - name: "smartintercom call"
    device_class: "motion"
    state: >
      {% if is_state("binary_sensor.smartintercom_line_detect", "on") %}
        on
      {% else %}
        off
      {% endif %}

- sensor:
  - name: "smartintercom modes"
    state: >
      {% if is_state('select.smartintercom_modes', 'Не активен') %}
        normal
      {% elif is_state('select.smartintercom_modes', 'Открывать всегда') %}
        auto
      {% else %}
        quiet
      {% endif %}
  - name: "smartintercom sound invert"
    state: >
      {% if is_state("switch.smartintercom_sound", "on") %}
        off
      {% else %}
        on
      {% endif %}
  - name: "smartintercom accept call invert"
    state: >
      {% if is_state("switch.smartintercom_accept_call", "on") %}
        off
      {% else %}
        on
      {% endif %}