- binary_sensor:
  - name: "smartintercom state"
    device_class: "door"
    state: >
      {% if is_state("switch.corridor_smartintercom_otkryt_dver", "on") or is_state("select.corridor_smartintercom_postoiannyi_rezhim_raboty", "Открывать всегда") %}
        on
      {% else %}
        off
      {% endif %}

  - name: "smartintercom call"
    device_class: "motion"
    state: >
      {% if is_state("binary_sensor.corridor_smartintercom_detektor_vyzova", "on") %}
        on
      {% else %}
        off
      {% endif %}

- sensor:
  - name: "smartintercom modes"
    state: >
      {% if is_state('select.corridor_smartintercom_postoiannyi_rezhim_raboty', 'Не активен') %}
        normal
      {% elif is_state('select.corridor_smartintercom_postoiannyi_rezhim_raboty', 'Открывать всегда') %}
        auto
      {% else %}
        quiet
      {% endif %}
  - name: "smartintercom sound invert"
    state: >
      {% if is_state("switch.corridor_smartintercom_bezzvuchnyi_rezhim", "on") %}
        off
      {% else %}
        on
      {% endif %}
  - name: "smartintercom accept call invert"
    state: >
      {% if is_state("switch.corridor_smartintercom_otkryt_dver", "on") %}
        off
      {% else %}
        on
      {% endif %}